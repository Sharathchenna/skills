<!doctype html>
<!--
  World (studio set): the film's whole 3D set, mounted under every HTML layer. Built from the Diffie–Hellman rebuild
  and the "black-glass studio" look found in pmndrs/drei, three.js RoomEnvironment and HyperFrames' product-turntable.
  Keep these generic parts:
    - render(t) is a pure function of t; all randomness is seeded; the GSAP clock drives it (seek-safe).
    - Camera: plays back a path sampled by scripts/camera_path.py (CFG.camPath, CFG.fps). 30-degree lens.
    - Labels: DOM text (#world-labels) placed from 3D anchors by placeLabels(), clamped to the STAGE zone and never
      overlapping, so `npx hyperframes check` audits them. Never draw readable text into WebGL.
    - Set: a lightformer environment (emissive softbox panels -> PMREM) so dark metal reads as metal; a satin floor with
      a pool of light under the hero and a warm pool behind it, fogged into a void of the same colour; contact shadows
      instead of a mirror; seeded out-of-focus bokeh; ACES; bloom only on HDR (> 1) values; a grade pass with grain
      (seeded by frame) and vignette; MSAA in a half-float target. See references/backgrounds.md.
    - No NaN anywhere (GLSL pow() of negatives, undefined anchors): one NaN pixel turns the bloomed frame black.
  Replace the HERO section with your recurring object, and the middle of render(t) with your story states.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #06080b; }
      #world-root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #06080b; }
      #world-canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      @font-face { font-family: 'WInter'; src: url('assets/fonts/Inter-700.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'WMono'; src: url('assets/fonts/JetBrainsMono-400.woff2') format('woff2'); font-weight: 400; }
      /* Vignette over the 3D set, under every text layer. */
      #world-vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(120% 75% at 50% 46%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.38) 78%, rgba(0,0,0,0.72) 100%); }
      /* Labels are real DOM text placed from 3D positions, so `hyperframes check` audits overlaps and safe zones. */
      #world-labels { position: absolute; inset: 0; pointer-events: none; }
      .wl { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: 'WInter', Inter, sans-serif; font-weight: 700;
            color: #F4F1EA; text-shadow: 0 2px 16px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.8); opacity: 0; will-change: transform, opacity; }
      .wl.name { font-size: 40px; letter-spacing: 0.01em; }
      .wl.name.dim { font-size: 34px; color: rgba(232,237,242,0.82); }
      .wl.val { font-size: 52px; }
      .wl.mono { font-family: 'WMono', 'JetBrains Mono', monospace; font-weight: 400; font-size: 32px; }
    </style>
  </head>
  <body>
    <div id="world-root" data-composition-id="world" data-start="0" data-duration="__DUR__" data-width="1080" data-height="1920">
      <canvas id="world-canvas" class="clip" data-start="0" data-duration="__DUR__" data-track-index="1" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="world-labels"></div>
    </div>

    <script>
      window.__WORLD_CONFIG = __CONFIG__;
      (function () {
        var D = window.__WORLD_CONFIG.total;
        var clock = { t: 0 };
        var host = { clock: clock, render: null, config: window.__WORLD_CONFIG, events: window.__WORLD_CONFIG.events };
        window.__world = host;
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["world"] = new Promise(function (resolve) { host.ready = resolve; });
        var tl = gsap.timeline({ paused: true });
        tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: function () { if (host.render) host.render(clock.t); } });
        window.__timelines = window.__timelines || {};
        window.__timelines["world"] = tl;
      })();
    </script>

    <script type="module">
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.184.0/+esm";
      const CDN = "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/";
      let Reflector = null, EffectComposer = null, RenderPass = null, UnrealBloomPass = null, OutputPass = null, ShaderPass = null;
      const { HorizontalBlurShader } = await import(CDN + "shaders/HorizontalBlurShader.js/+esm");
      const { VerticalBlurShader } = await import(CDN + "shaders/VerticalBlurShader.js/+esm");
      const DBG = new URLSearchParams(location.search);
      if (!DBG.has("noreflect")) try { ({ Reflector } = await import(CDN + "objects/Reflector.js/+esm")); } catch (e) { console.error("[world] reflector unavailable", e); }
      if (!DBG.has("nobloom")) try {
        ({ EffectComposer } = await import(CDN + "postprocessing/EffectComposer.js/+esm"));
        ({ RenderPass } = await import(CDN + "postprocessing/RenderPass.js/+esm"));
        ({ UnrealBloomPass } = await import(CDN + "postprocessing/UnrealBloomPass.js/+esm"));
        ({ OutputPass } = await import(CDN + "postprocessing/OutputPass.js/+esm"));
        ({ ShaderPass } = await import(CDN + "postprocessing/ShaderPass.js/+esm"));
      } catch (e) { console.error("[world] postprocessing unavailable", e); EffectComposer = null; }

      const host = window.__world;
      const CFG = host.config;
      const A = CFG.anchors;
      const EX = CFG.example;
      const W = 1080, H = 1920;

      // ------------------------------------------------------------------ helpers
      const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ramp = (t, a, d) => cl((t - a) / d);
      const eio = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const eo3 = (x) => 1 - Math.pow(1 - x, 3);
      const lerp = (a, b, k) => a + (b - a) * k;
      function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const V = (x, y, z) => new THREE.Vector3(x, y, z);
      const C = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);

      // ------------------------------------------------------------------ palette
      const COL = { amber: C(1.0, 0.6, 0.2), ink: C(0.96, 0.95, 0.92) };

      // ------------------------------------------------------------------ renderer
      const canvas = document.getElementById("world-canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.2;   // ACES keeps the paint saturated (AgX washed it out)
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060508);
      scene.fog = new THREE.Fog(0x060508, 12, 26);   // same colour as the void: the cyclorama dissolves, no horizon
      const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 300)   // long lens: compressed, studio look;

      let composer = null, grade = null;
      if (EffectComposer) {
        try {
          const crt = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
          composer = new EffectComposer(renderer, crt);
          composer.setPixelRatio(1);
          composer.setSize(W, H);
          composer.addPass(new RenderPass(scene, camera));
          composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.75, 0.6, 1.0));   // only HDR (> 1) values bloom
          composer.addPass(new OutputPass());
          if (ShaderPass) {
            grade = new ShaderPass({
              uniforms: { tDiffuse: { value: null }, uFrame: { value: 0 }, uGrain: { value: 0.035 }, uVig: { value: 0.5 }, uAspect: { value: W / H } },
              vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
              fragmentShader: `uniform sampler2D tDiffuse; uniform float uFrame, uGrain, uVig, uAspect; varying vec2 vUv;
                float h(vec3 p){ p = fract(p * vec3(443.897, 441.423, 437.195)); p += dot(p, p.yzx + 19.19); return fract((p.x + p.y) * p.z); }
                void main(){
                  vec3 c = texture2D(tDiffuse, vUv).rgb;
                  vec2 q = (vUv - 0.5) * vec2(1.0, 1.0 / uAspect) * 0.75; float v = smoothstep(1.0, 0.25, length(q)); c *= mix(1.0 - uVig, 1.0, v);
                  float n = h(vec3(floor(vUv * vec2(1080.0, 1920.0) / 1.5), uFrame)) - 0.5;
                  c += n * uGrain * (0.6 + 0.4 * (1.0 - dot(c, vec3(0.299, 0.587, 0.114))));
                  gl_FragColor = vec4(c, 1.0); }`,
            });
            composer.addPass(grade);
          }
        } catch (e) { console.error("[world] composer failed", e); composer = null; }
      }

      // ------------------------------------------------------------------ fonts + textures
      for (const [fam, url, wt] of [["WInter", "assets/fonts/Inter-700.woff2", "700"], ["WMono", "assets/fonts/JetBrainsMono-400.woff2", "400"]]) {
        try { const f = new FontFace(fam, `url(${url})`, { weight: wt }); document.fonts.add(await f.load()); } catch (e) { console.error("[world] font", fam, e); }
      }
      const maxAniso = renderer.capabilities.getMaxAnisotropy();
      const mkCanvas = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
      const texOf = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t; };
      const measure = (font, text) => { const g = mkCanvas(8, 8).getContext("2d"); g.font = font; return g.measureText(text).width; };
      function glowTex() {
        const S = 256, c = mkCanvas(S, S), g = c.getContext("2d");
        const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
        gr.addColorStop(0, "rgba(255,255,255,0.9)"); gr.addColorStop(0.25, "rgba(255,255,255,0.35)"); gr.addColorStop(1, "rgba(255,255,255,0)");
        g.fillStyle = gr; g.fillRect(0, 0, S, S);
        return texOf(c);
      }
      function swirlTex() {
        // paint surface: soft radial shading + spiral streaks (greyscale, tinted by material colour)
        const S = 512, c = mkCanvas(S, S), g = c.getContext("2d"), r = mulberry32(11);
        const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
        gr.addColorStop(0, "#ffffff"); gr.addColorStop(0.8, "#d9d9d9"); gr.addColorStop(1, "#8a8a8a");
        g.fillStyle = gr; g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();
        g.lineCap = "round";
        for (let k = 0; k < 26; k++) {
          const a0 = r() * Math.PI * 2, light = r() < 0.5;
          g.strokeStyle = light ? "rgba(255,255,255,0.55)" : "rgba(90,90,90,0.35)";
          g.lineWidth = 3 + r() * 9;
          g.beginPath();
          for (let s = 0; s <= 40; s++) { const u = s / 40, rad = (0.08 + 0.85 * u) * S / 2, a = a0 + u * 3.2; const x = S / 2 + Math.cos(a) * rad, y = S / 2 + Math.sin(a) * rad; s ? g.lineTo(x, y) : g.moveTo(x, y); }
          g.stroke();
        }
        return texOf(c);
      }
      function ringTex() {
        const S = 512, c = mkCanvas(S, S), g = c.getContext("2d"), r = mulberry32(42);
        const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
        gr.addColorStop(0, "rgba(255,226,180,0.0)"); gr.addColorStop(0.86, "rgba(255,226,180,0.12)"); gr.addColorStop(0.98, "rgba(255,236,205,0.85)"); gr.addColorStop(1, "rgba(255,236,205,0)");
        g.fillStyle = gr; g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(255,240,220,0.5)";
        for (let k = 0; k < 1400; k++) { const a = r() * Math.PI * 2, d = (0.75 + 0.24 * Math.sqrt(r())) * S * 0.5; g.fillRect(S / 2 + Math.cos(a) * d, S / 2 + Math.sin(a) * d, 1.6, 1.6); }
        return texOf(c);
      }
      const GLOW = glowTex(), SWIRL = swirlTex(), RING = ringTex();

      // ------------------------------------------------------------------ the room (Look A: black-glass studio)
      // After pmndrs/drei Lightformer + Environment, three's RoomEnvironment, drei Backdrop + ContactShadows, and the
      // HyperFrames product-turntable block: softbox reflections on dark metal, a seamless cyclorama with a pool of
      // light behind the hero, soft contact shadows instead of a mirror, out-of-focus bokeh instead of dust.
      scene.add(new THREE.AmbientLight(0xb8c0d0, 0.05));
      const key = new THREE.DirectionalLight(0xfff1e0, 0.9); key.position.set(-3, 6, 4); scene.add(key);
      const rim = new THREE.DirectionalLight(0xffd9b0, 1.4); rim.position.set(4, 4, -6); scene.add(rim);

      // 1. lightformer environment: emissive panels rendered once into a PMREM env map (no HDRI file)
      {
        const env = new THREE.Scene();
        env.background = new THREE.Color(0x050407);
        const lf = (w, h, pos, color, intensity, form = "rect", target = [0, 1, 0]) => {
          const geo = form === "ring" ? new THREE.RingGeometry(0.35, 0.5, 64) : form === "circle" ? new THREE.CircleGeometry(0.5, 64) : new THREE.PlaneGeometry(1, 1);
          const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, toneMapped: false });
          mat.color.multiplyScalar(intensity);
          const m = new THREE.Mesh(geo, mat); m.scale.set(w, h, 1); m.position.set(...pos); m.lookAt(...target); env.add(m);
        };
        lf(1.2, 8, [-5, 2, 3], 0xffffff, 6);            // tall key strip, left
        lf(1.2, 8, [5, 2, -3], 0xffe6c8, 9);            // warm rim strip, back right
        lf(8, 8, [0, 7, 0], 0xffffff, 1.2);             // soft ceiling
        lf(3, 3, [-6, 1, -6], 0x2a6bff, 3, "ring");     // cool accent ring: a ring glint on the metal
        lf(0.6, 6, [3.5, 2, 5], 0xffffff, 2.5);         // thin front-right strip for a second highlight line
        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(env, 0.04).texture;
        scene.environmentIntensity = 1.0;
      }

      // 2. a stage: one big satin floor; pools of light under and behind the pots fall off into the void. With a
      //    long lens looking down, the floor IS the background, so its light falloff does the job of a cyclorama.
      {
        const floorM = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x100e12, roughness: 0.5, metalness: 0.2, dithering: true, envMapIntensity: 0.35 }));
        floorM.rotation.x = -Math.PI / 2; scene.add(floorM);
      }
      // light pools painted onto the floor (a baked, additive gradient): spotlights here put hot specular flashes on
      // the glossy metal that bloom into blobs as the camera moves, so the pools carry no analytic light at all
      {
        const S2 = 1024, c = mkCanvas(S2, S2), g = c.getContext("2d");
        const pool = (cx, cy, r, rgb, a) => { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(0.55, `rgba(${rgb},${a * 0.35})`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(0, 0, S2, S2); };
        g.fillStyle = "#000"; g.fillRect(0, 0, S2, S2);
        pool(S2 * 0.5, S2 * 0.36, S2 * 0.34, "255,150,80", 0.55);     // warm pool behind the pots
        pool(S2 * 0.5, S2 * 0.52, S2 * 0.17, "255,236,214", 0.42);    // soft pool under the pots
        const tex = texOf(c);
        const poolM = new THREE.Mesh(new THREE.PlaneGeometry(24, 24), new THREE.MeshBasicMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.55 }));
        poolM.rotation.x = -Math.PI / 2; poolM.position.set(0, 0.001, -0.5 + 24 * (0.52 - 0.5)); poolM.renderOrder = 0; scene.add(poolM);
      }

      // 3. contact shadows (port of drei ContactShadows / three webgl_shadow_contact): depth from below, blurred twice
      const cshadow = (() => {
        const size = 7, far = 1.4, res = 512, blur = 2.6;
        const group = new THREE.Group(); group.position.y = 0.002;
        const rt = new THREE.WebGLRenderTarget(res, res), rtB = new THREE.WebGLRenderTarget(res, res);
        rt.texture.generateMipmaps = rtB.texture.generateMipmaps = false;
        const geo = new THREE.PlaneGeometry(size, size).rotateX(Math.PI / 2);
        const plane = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: rt.texture, transparent: true, opacity: 0.85, depthWrite: false }));
        plane.scale.y = -1; plane.renderOrder = 1; group.add(plane);
        const blurPlane = new THREE.Mesh(geo); blurPlane.visible = false; group.add(blurPlane);
        const cam = new THREE.OrthographicCamera(-size / 2, size / 2, size / 2, -size / 2, 0, far); cam.rotation.x = Math.PI / 2; group.add(cam);
        const depthMat = new THREE.MeshDepthMaterial(); depthMat.depthTest = depthMat.depthWrite = false;
        depthMat.onBeforeCompile = (s) => { s.fragmentShader = s.fragmentShader.replace("vec4( vec3( 1.0 - fragCoordZ ), opacity );", "vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * 1.0 );"); };
        const hB = new THREE.ShaderMaterial(HorizontalBlurShader), vB = new THREE.ShaderMaterial(VerticalBlurShader);
        hB.depthTest = vB.depthTest = false;
        const blurOnce = (amt) => {
          blurPlane.visible = true;
          blurPlane.material = hB; hB.uniforms.tDiffuse.value = rt.texture; hB.uniforms.h.value = amt / 256;
          renderer.setRenderTarget(rtB); renderer.render(blurPlane, cam);
          blurPlane.material = vB; vB.uniforms.tDiffuse.value = rtB.texture; vB.uniforms.v.value = amt / 256;
          renderer.setRenderTarget(rt); renderer.render(blurPlane, cam);
          blurPlane.visible = false;
        };
        const hidden = [];   // particles, glows, orbs and labels must not cast shadow blobs
        group.hideDuringShadow = (o) => hidden.push(o);
        group.update = () => {
          const bg = scene.background, fog = scene.fog;
          const skip = [];   // only solid geometry casts: hide sprites, points, additive and transparent things
          scene.traverse((o) => { if (o.visible && o !== group && (o.isSprite || o.isPoints || (o.material && (o.material.transparent || o.material.blending === THREE.AdditiveBlending)))) skip.push(o); });
          const vis = skip.map((o) => o.visible);
          scene.background = null; scene.fog = null; plane.visible = false; skip.forEach((o) => (o.visible = false));
          scene.overrideMaterial = depthMat;
          const cc = renderer.getClearColor(new THREE.Color()), ca = renderer.getClearAlpha();
          renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, cam);
          scene.overrideMaterial = null; blurOnce(blur); blurOnce(blur * 0.4);
          renderer.setRenderTarget(null); renderer.setClearColor(cc, ca);
          plane.visible = true; scene.background = bg; scene.fog = fog; skip.forEach((o, k) => (o.visible = vis[k]));
        };
        scene.add(group);
        return group;
      })();

      // 4. fake bokeh instead of dust: seeded hexagon discs behind the set, size from a thin-lens circle of confusion
      const BOKEH = 34, bR = mulberry32(9), bPos = [], bCol = [], bSeed = [];
      const bokehPal = [[1.0, 0.72, 0.42], [1.0, 0.82, 0.6], [0.45, 0.62, 1.0], [0.35, 0.95, 0.85], [1.0, 0.55, 0.2]];
      for (let k = 0; k < BOKEH; k++) {
        if (k < 24) bPos.push((bR() - 0.5) * 20, 0.3 + bR() * 2.2, -8 - bR() * 10);      // far: out of focus behind the set
        else bPos.push((bR() < 0.5 ? -1 : 1) * (1.6 + bR() * 1.4), 2.6 + bR() * 2.2, 6.5 + bR() * 2.5);   // near: big soft discs at the frame edges
        const c = bokehPal[Math.floor(bR() * bokehPal.length)]; bCol.push(...c); bSeed.push(bR() * 6.28);
      }
      const bGeo = new THREE.BufferGeometry();
      bGeo.setAttribute("position", new THREE.Float32BufferAttribute(bPos, 3));
      bGeo.setAttribute("color", new THREE.Float32BufferAttribute(bCol, 3));
      bGeo.setAttribute("seed", new THREE.Float32BufferAttribute(bSeed, 1));
      const bokehMat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true, toneMapped: false, fog: false,
        uniforms: { uT: { value: 0 }, uFocus: { value: 6.5 }, uScale: { value: 1920 } },
        vertexShader: `attribute float seed; uniform float uT, uFocus, uScale; varying vec3 vC; varying float vA;
          void main(){
            vec3 p = position + vec3(sin(uT * 0.11 + seed) * 0.25, sin(uT * 0.07 + seed * 1.7) * 0.18, 0.0);
            vec4 mv = modelViewMatrix * vec4(p, 1.0); float d = -mv.z;
            float coc = clamp(abs(d - uFocus) / d * 0.9, 0.02, 0.6);
            gl_PointSize = clamp(coc * uScale * 0.16, 6.0, 150.0);
            vA = clamp(1600.0 / (gl_PointSize * gl_PointSize), 0.04, 0.55) * (0.6 + 0.4 * sin(uT * 0.5 + seed * 3.0));
            vC = color; gl_Position = projectionMatrix * mv; }`,
        fragmentShader: `varying vec3 vC; varying float vA;
          void main(){
            vec2 q = gl_PointCoord * 2.0 - 1.0;
            float r = length(q);
            float m = smoothstep(1.0, 0.55, r);                                        // soft round disc
            float rimL = smoothstep(0.6, 0.92, r) * smoothstep(1.0, 0.9, r) * 0.6;    // faint lens rim
            gl_FragColor = vec4(vC * (0.7 * m + 0.6 * rimL) * vA, 1.0); }`,
      });
      const bokeh = new THREE.Points(bGeo, bokehMat); scene.add(bokeh);
      cshadow.hideDuringShadow(bokeh);
      const shafts = [];
      function updateDust(t) { bokehMat.uniforms.uT.value = t; bokehMat.uniforms.uFocus.value = camera.position.distanceTo(camLook); }

      // ------------------------------------------------------------------ HERO (replace with your recurring object)
      const heroMat = new THREE.MeshPhysicalMaterial({ color: 0x1a1a1f, roughness: 0.28, metalness: 1.0, clearcoat: 0.6, clearcoatRoughness: 0.15 });
      const hero = new THREE.Mesh(new THREE.TorusKnotGeometry(0.45, 0.14, 200, 32), heroMat);
      hero.position.set(0, 0.9, 0); scene.add(hero);
      const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.54, 0.32, 64), new THREE.MeshPhysicalMaterial({ color: 0x141418, roughness: 0.45, metalness: 0.6, clearcoat: 0.3 }));
      ped.position.set(0, 0.16, 0); scene.add(ped);
      // something that glows: values above 1 with toneMapped:false are what the bloom picks up
      const core = new THREE.Mesh(new THREE.SphereGeometry(0.09, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.0, 0.6, 0.2).multiplyScalar(3), toneMapped: false }));
      core.position.set(0, 1.7, 0); scene.add(core);

      // labels: DOM text placed from 3D anchors (in the render loop), kept inside the stage zone, never overlapping
      const labelsRoot = document.getElementById("world-labels");
      const STAGE = { x0: 130, x1: 770, y0: 480, y1: 1010 };   // HyperFrames' TikTok/Reels/Shorts clear bands; header above, captions below
      const LBL = {};
      function mkLabel(id, cls) { const el = document.createElement("div"); el.id = "wl-" + id; el.className = "wl " + cls; labelsRoot.appendChild(el); LBL[id] = { el, text: null, w: 0, h: 0 }; }
      for (const [id, cls] of [["hero", "name"], ["value", "val"]]) mkLabel(id, cls);   // one element per label you will place
      const proj = new THREE.Vector3();
      function toScreen(p) { proj.copy(p).project(camera); return { x: (proj.x + 1) / 2 * W, y: (1 - proj.y) / 2 * H, behind: proj.z > 1 }; }
      function placeLabels(items) {
        // items: {id, text, color, at (Vector3), dy (px, + = below), op, pri}; higher pri places first
        const placed = [];
        items.sort((a, b) => b.pri - a.pri);
        for (const it of items) {
          const L = LBL[it.id];
          if (it.op < 0.01) { L.el.style.opacity = "0"; continue; }
          if (L.text !== it.text) { L.el.textContent = it.text; L.text = it.text; L.w = L.el.offsetWidth; L.h = L.el.offsetHeight; }
          if (it.color) L.el.style.color = it.color;
          const p = toScreen(it.at);
          if (p.behind) { L.el.style.opacity = "0"; continue; }
          const x = cl(p.x - L.w / 2, STAGE.x0, STAGE.x1 - L.w), y0 = p.y + it.dy - L.h / 2;
          let ok = false, y = y0;
          for (const off of [0, 1, -1, 2, -2, 3]) {
            y = cl(y0 + off * (L.h * 0.9 + 8), STAGE.y0, STAGE.y1 - L.h);
            if (!placed.some((r) => x < r.x + r.w + 12 && r.x < x + L.w + 12 && y < r.y + r.h + 6 && r.y < y + L.h + 6)) { ok = true; break; }
          }
          if (!ok) { L.el.style.opacity = "0"; continue; }
          placed.push({ x, y, w: L.w, h: L.h });
          L.el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
          L.el.style.opacity = it.op.toFixed(3);
        }
      }

      // camera: tools/gen.py samples a C1-continuous spline at 30 fps; play it back exactly
      const PATH = CFG.camPath, FPS = CFG.fps;
      const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
      function cameraAt(t) {
        const f = cl(t * FPS, 0, PATH.length - 1), i = Math.floor(f), j = Math.min(i + 1, PATH.length - 1), u = f - i;
        const a = PATH[i], b = PATH[j];
        camPos.set(lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u));
        camLook.set(lerp(a[3], b[3], u), lerp(a[4], b[4], u), lerp(a[5], b[5], u));
        camera.position.copy(camPos); camera.lookAt(camLook);
        if (a.length > 6) { const fov = lerp(a[6], b[6], u); if (Math.abs(fov - camera.fov) > 1e-4) { camera.fov = fov; camera.updateProjectionMatrix(); } }   // zoom
      }

      // ------------------------------------------------------------------ render
      host.render = (t) => {
        cameraAt(t);
        updateDust(t);
        // ---- your story states: every value is a function of t (ramp/eio on anchors), never of the previous frame
        hero.rotation.y = t * 0.35;
        core.position.y = 1.7 + Math.sin(t * 1.3) * 0.05;
        // ---- labels: DOM text from 3D anchors, clamped into the stage, collision-free
        placeLabels([
          { id: "hero", text: "the recurring object", at: V(0, 0.0, 0.55), dy: 34, op: ramp(t, 0.5, 0.5), pri: 2 },
          { id: "value", text: "42", color: "#ffd0a0", at: V(0, 1.7, 0), dy: -40, op: ramp(t, 2, 0.4), pri: 3 },
        ]);
        cshadow.update();
        if (grade) grade.uniforms.uFrame.value = Math.round(t * 30);
        if (composer) composer.render(0); else renderer.render(scene, camera);
      };
      host.render(host.clock.t);
      host.ready();
    </script>
  </body>
</html>
